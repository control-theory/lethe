name: Test

# Reports the status check named exactly `test`, which the org's main-branch
# ruleset requires on every pull request into main (CR: control-theory/docs#1218).
# Keep the job id and `name:` as `test`: renaming either one blocks every merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # All dependencies are public, so no private-module authentication.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The Makefile's lint target is `go vet ./...`.
      - name: make lint
        run: make lint

      - name: make test
        run: make test
